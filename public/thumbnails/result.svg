<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgFFyL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f24" />
      <stop offset="100%" stop-color="#2d153d" />
    </linearGradient>
    <linearGradient id="wallPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glassPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgFFyL)"/>
  <ellipse cx="300" cy="335" rx="220" ry="25" fill="#0c0414" opacity="0.7"/>

  <!-- Academic Pavilion Isometric Representation -->
  <!-- Base Foundation -->
  <polygon points="120,305 300,355 480,305 300,255" fill="#3b2d4a"/>

  <!-- Main Hall / Ground Level -->
  <polygon points="150,285 290,325 290,205 150,165" fill="url(#wallPurple)"/>
  <polygon points="290,325 450,285 450,165 290,205" fill="#c4b5fd"/>

  <!-- Portico Columns -->
  <line x1="180" y1="285" x2="180" y2="215" stroke="#7c3aed" stroke-width="4"/>
  <line x1="220" y1="298" x2="220" y2="225" stroke="#7c3aed" stroke-width="4"/>
  <line x1="260" y1="310" x2="260" y2="235" stroke="#7c3aed" stroke-width="4"/>

  <!-- Large Library / Seminar Windows -->
  <polygon points="310,295 425,268 425,190 310,215" fill="url(#glassPurple)" stroke="#c084fc" stroke-width="2"/>

  <!-- Upper Cantilevered Study Terrace / Roof -->
  <polygon points="130,165 285,205 440,165 285,125" fill="#4c1d95"/>
  <polygon points="120,125 285,165 450,125 285,85" fill="url(#accentPurple)"/>

  <!-- Badge Tag: RECIENTE -->
  <rect x="25" y="25" width="105" height="28" rx="6" fill="#4c1d95" fill-opacity="0.9" stroke="#a855f7"/>
  <text x="35" y="44" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RECIENTE</text>

  <!-- Title Pill -->
  <rect x="140" y="25" width="130" height="28" rx="6" fill="#1e1030" fill-opacity="0.8" stroke="#6b21a8"/>
  <text x="150" y="44" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FILOSOFÍA Y LETRAS</text>
</svg>
